# michi-chat quickstart: the published image + LiteLLM + Postgres(pgvector).
#
# 1. Put this file, .env.example and litellm.config.yaml in one directory
# 2. cp .env.example .env  and fill in the required values
# 3. docker compose up -d   → http://localhost:3001 (demo tenant), /admin (operator UI)
#
# Only the app's port is published, and only on localhost. Anything public-facing
# belongs behind a reverse proxy that terminates TLS and sets x-real-ip.

services:
  app:
    image: ${MICHI_IMAGE:-ghcr.io/OWNER/michi-chat:latest}
    environment:
      DATABASE_URL: "postgres://michi:${MICHI_DB_PASSWORD:?set MICHI_DB_PASSWORD in .env}@db:5432/michichat"
      LITELLM_BASE_URL: "http://litellm:4000/v1"
      LITELLM_API_KEY: "${MICHI_CHAT_LITELLM_KEY:?set MICHI_CHAT_LITELLM_KEY in .env}"
      CHAT_MODEL: "michi"
      EMBED_MODEL: "embed"
      ADMIN_PASSWORD: "${MICHI_ADMIN_PASSWORD:?set MICHI_ADMIN_PASSWORD in .env}"
      DEFAULT_TENANT_SLUG: "mugshot"
    ports:
      - "127.0.0.1:${MICHI_PORT:-3001}:3000"
    depends_on:
      db:
        condition: service_healthy
      litellm:
        condition: service_started
    restart: unless-stopped

  # One OpenAI-compatible door in front of any provider. Which real models serve the
  # aliases michi/judge/embed is decided in litellm.config.yaml, never in app code.
  litellm:
    # Pinned by digest (this is v1.93.0) rather than the moving main-stable tag, so a
    # future upstream change cannot silently break fresh installs.
    image: ghcr.io/berriai/litellm@sha256:a1745e629abfb17d434426ff48b115f54f4f4c4a0f5af241de569e93c63c411e
    volumes:
      - ./litellm.config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_MASTER_KEY: "${MICHI_CHAT_LITELLM_KEY:?}"
      OLLAMA_API_BASE: "${OLLAMA_API_BASE:-http://host.docker.internal:11434}"
      # Hosted-provider path: uncomment in .env and reference from litellm.config.yaml.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      DASHSCOPE_API_KEY: "${DASHSCOPE_API_KEY:-}"
    extra_hosts:
      # Makes host.docker.internal resolve on plain Linux, not just Docker Desktop.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # pgvector image is REQUIRED: a migration runs CREATE EXTENSION vector.
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: michi
      POSTGRES_DB: michichat
      POSTGRES_PASSWORD: "${MICHI_DB_PASSWORD:?}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michi -d michichat"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
