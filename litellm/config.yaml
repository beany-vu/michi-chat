# LiteLLM model routing. The app only ever asks for the ALIASES on the left;
# what actually serves them is config here — the whole point of the proxy.
model_list:
  - model_name: michi
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: os.environ/OLLAMA_API_BASE

  # A second, different model for judging/evals (never grade your own homework).
  # qwen3:8b after qwen2.5:7b proved too erratic on compound rubric facts.
  - model_name: judge
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: os.environ/OLLAMA_API_BASE

  # Trial alias: point a tenant's "Model alias" field at this to A/B a different chat
  # model with zero code changes. Currently Gemma 3 4B.
  - model_name: gemma
    litellm_params:
      model: ollama_chat/gemma3:4b
      api_base: os.environ/OLLAMA_API_BASE

  # The economy tier: ~4x smaller and faster than michi. Honest caveat, measured not
  # assumed: tool-calling reliability degrades below ~4B, so run kb:eval and real tool
  # questions against any tenant before switching it here.
  - model_name: michi-mini
    litellm_params:
      model: ollama_chat/gemma3:1b
      api_base: os.environ/OLLAMA_API_BASE

  # Embeddings for the RAG knowledge base. 768 dimensions — kb_chunks.embedding is sized
  # to this, so swapping the model here also means a migration plus re-embedding.
  - model_name: embed
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: os.environ/OLLAMA_API_BASE
      # The OpenAI SDK always sends encoding_format, Ollama supports neither value of it,
      # and translating that away is exactly the proxy's job.
      drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
