# Build and publish the image to GHCR on version tags only (git tag v0.1.0 && git push --tags).
# Auth is the workflow's own GITHUB_TOKEN; there are no secrets to configure. After the FIRST
# publish, flip the package to public in the repo's Packages settings or pulls will 404.

name: publish-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

# A newer tag supersedes an older in-flight build. This is what keeps a burst of tags in one
# session from queuing five ~10-minute builds behind each other: only the latest survives.
concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  build-push:
    # Self-hosted by policy. Safe here because the workflow triggers on tag pushes only
    # (never on fork PRs). A runner must be registered on the repo BEFORE tagging, or the
    # job queues for 24h and is discarded: Settings -> Actions -> Runners -> New runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # amd64 only. The production server and the vast majority of users are x86_64; arm64
      # was built via QEMU emulation and cost ~80% of the build time for an audience that
      # can run the amd64 image under emulation anyway. Add linux/arm64 back (and the
      # setup-qemu-action step) only if a native arm64 image is genuinely needed.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No cache-to: type=gha. GHA cache writes to GitHub's ACCOUNT-WIDE artifact
          # storage quota, which a self-hosted runner does NOT bypass (it only frees
          # compute). That quota is full, and the cache export failed the job even though
          # the image published fine. The self-hosted runner's own Docker daemon keeps a
          # local layer cache between builds, so cross-run caching still works for free.
