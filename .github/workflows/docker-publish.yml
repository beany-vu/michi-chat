# Build and publish the image to GHCR on version tags only (git tag v0.1.0 && git push --tags).
# Auth is the workflow's own GITHUB_TOKEN; there are no secrets to configure. After the FIRST
# publish, flip the package to public in the repo's Packages settings or pulls will 404.

name: publish-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    # Self-hosted by policy. Safe here because the workflow triggers on tag pushes only
    # (never on fork PRs). A runner must be registered on the repo BEFORE tagging, or the
    # job queues for 24h and is discarded: Settings → Actions → Runners → New runner.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # arm64 is built via QEMU emulation; slow (~15 min) but fine at release cadence.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
