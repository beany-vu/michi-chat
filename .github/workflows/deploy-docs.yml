# Build the VitePress docs and push the static output to the gh-pages branch.
# One-time setup in the repo: Settings → Pages → Source: "Deploy from a branch"
# → Branch: gh-pages / (root).  Site: https://beany-vu.github.io/michi-chat/
#
# Deliberately NOT the upload-pages-artifact flow: artifacts live in GitHub's
# account-wide storage quota (self-hosted runners don't change that), and this
# account's quota is spoken for. A branch push stores nothing but git.

name: deploy-docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "llms.txt", "package.json", "package-lock.json", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    # Self-hosted by policy; push-triggered only, never fork PRs.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/.vitepress/dist
          force_orphan: true
