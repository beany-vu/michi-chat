# Build the VitePress docs and deploy to GitHub Pages on every docs change.
# One-time setup in the repo: Settings → Pages → Source: "GitHub Actions".
# Site: https://beany-vu.github.io/michi-chat/

name: deploy-docs

on:
  push:
    branches: [master]
    paths: ["docs/**", "package.json", "package-lock.json", ".github/workflows/deploy-docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Self-hosted by policy; push-triggered only, never fork PRs.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run docs:build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.vitepress/dist

  deploy:
    needs: build
    runs-on: self-hosted
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
